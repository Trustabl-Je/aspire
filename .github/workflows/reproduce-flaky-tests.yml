name: Flaky investigation recovery validation
run-name: "Recover flaky investigation: ${{ inputs.issue_url }}"
on:
  workflow_dispatch:
    inputs:
      issue_url:
        required: true
        type: string
permissions:
  actions: write
  contents: write
concurrency:
  group: flaky-investigation-recovery-${{ inputs.issue_url }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reconcile exact owned runs and recover expired outer jobs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE_URL: ${{ inputs.issue_url }}
          RECOVERY_ENROLLMENT: '{"issue_url":"https://github.com/microsoft/aspire/issues/9672","control_sha":"9a4ab756620648f2f45e730591a69d224a9f495f","agent_sha":"44aa95af2ab9b3a9a2be1c673a9fa75cc67d9c6a","worker_sha":"e57778c84e8f0bce064ff4b9abe7b4bcf6af2a5c","control_branch":"ankj/flaky-investigation-control-e57778c84e8f"}'
          RECOVERY_INITIAL_OUTER: '40411973673'
        run: |
          python3 -c 'import json, os; assert os.environ["INPUT_ISSUE_URL"] == json.loads(os.environ["RECOVERY_ENROLLMENT"])["issue_url"]'
          python3 .github/scripts/flaky-investigation-recovery.py
