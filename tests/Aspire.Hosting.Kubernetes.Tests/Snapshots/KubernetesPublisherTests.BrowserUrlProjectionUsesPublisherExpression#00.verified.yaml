---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "backend-config"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "backend"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
data:
  ORIGIN: "{{ .Values.config.backend.frontend_http_BrowserOrigin }}"
  ORIGINS: "{{ .Values.config.backend.frontend_http_BrowserOrigins }}"
  ORIGINS_JSON: "{{ .Values.config.backend.frontend_http_BrowserOriginsJson }}"
  CONFIG: "origin={{ .Values.config.backend.frontend_http_BrowserOrigin }}"
